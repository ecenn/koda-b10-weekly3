<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WargaReport</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" type="image/svg" href="assets/logo.svg">
</head>
<body>
    <div class="modal">
        <div class="register">
            <div>
                <div>
                    <h2>Sign In to WargaReport</h2>
                    <img src="assets/close-x-icon.svg" alt="close-x-icon">
                </div>
                <p>Sign in to lodge a complaint or upvote issues.</p>
            </div>
            <div>
                <button class="btn btn-main-light">Sign In Existing Account</button>
                <button class="btn btn-main-dark">Register as Citizen</button>
            </div>
            <form action="#">
                <label for="name">Full Name (Nama Lengkap) *</label>
                <input type="text" id="name" placeholder="e.g. Budi Santoso">
                <div>
                    <div>
                        <label for="email">Email Address *</label>
                        <input type="email" id="email" placeholder="e.g. budi@wargareport.id">
                    </div>
                    <div>
                        <label for="phone">Phone / WhatsApp *</label>
                        <input type="number" id="phone" placeholder="+62 812-...">
                    </div>
                </div>
                <label for="email">NIK</label>
                <input type="text" id="email" placeholder="16 digits for verified resident badge (e.g. 3174...)">
                <span>Used exclusively for verification under UU PDP and never shown to the public.</span>
                <label for="password">Password *</label>
                <input type="text" id="password" placeholder="Create a password">
                <button class="btn btn-main-dark"><img src="assets/checklist-icon.svg" alt="checklist-icon">Create Account & Continue</button>
            </form>
        </div>
    </div>
</body>
</html>
