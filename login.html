<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WargaReport</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" type="image/svg" href="assets/logo.svg">
</head>
<body>
    <div class="modal">
        <div class="login">
            <div>
                <div>
                    <h2>Sign In to WargaReport</h2>
                    <img src="assets/close-x-icon.svg" alt="close-x-icon">
                </div>
                <p>Sign in to lodge a complaint or upvote issues.</p>
            </div>
            <div>
                <button class="btn btn-main-dark" onclick=Login()>Sign In Existing Account</button>
                <button class="btn btn-main-light" onclick=Register()>Register as Citizen</button>
            </div>
            <form action="#">
                <label for="email">Email Address</label>
                <input type="email" id="email" placeholder="Enter your Email">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Enter your password">
                <button type="submit" class="btn btn-main-dark">Sign In <img src="assets/arrow-light.svg" alt="arrow-light-icon"></button>
            </form>
        </div>
    </div>
    <script>
        const login = document.querySelector(".login")
        const register = document.querySelector(".register")

        function Login() {
            register.style.display = "none"
            login.style.display = "flex"
        }
        function Register() {
            login.style.display = "none"
            register.style.display = "flex"
        }
    </script>
</body>
</html>
